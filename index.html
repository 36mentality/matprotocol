<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Measurement Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Measurement Log</title>
<style>
*{box-sizing:border-box}
:root{--blue:#0b5cad;--bg:#f2f4f7;--card:#fff;--line:#d9dee5;--txt:#1b2430;--mut:#667085;--red:#c62828;--green:#2e7d32}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:10;background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
main{padding:12px 12px 110px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.hdr h2{margin:0}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt);font-family:inherit}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button.btn{font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600}
button.btn.sm{font-size:14px;padding:8px 12px;border-radius:8px}
button.btn.sec{background:#fff;color:var(--blue)}
button.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
button.btn.block{width:100%;margin-top:8px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;color:inherit;font:inherit}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--mut);margin-top:3px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;margin-right:4px;background:#e8eef6;color:var(--blue)}
.chip.red{background:#fdeaea;color:var(--red)}.chip.green{background:#e6f4e7;color:var(--green)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 4px 14px rgba(0,0,0,.28);border-radius:99px!important;padding:14px 20px!important}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.grid .ph{position:relative}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.grid .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:99px;width:26px;height:26px;font-size:16px;line-height:1}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .bar{position:sticky;top:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;z-index:2}
.overlay .bar button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:600}
.lightbox{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%}
.chk{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:16px;color:var(--txt)}
.chk input{width:22px;height:22px}
.muted{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.notice{background:#fff8e1;border-color:#f0c36d}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep th,table.rep td{border:1px solid var(--line);padding:5px;vertical-align:top;text-align:left}
table.rep th{background:#eef2f7}
.nr{background:#fdeaea}
/* Camera scan */
.scan{position:fixed;inset:0;z-index:120;background:#000;color:#fff;display:flex;flex-direction:column}
.scan .sbar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--blue);color:#fff}
.scan .sbar button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:600}
.scan video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.scan .sfoot{padding:12px 14px calc(14px + env(safe-area-inset-bottom));text-align:center;background:#111}
.scan .hint{font-size:14px;opacity:.9;margin-bottom:10px}
.scan.light{background:var(--bg);color:var(--txt);overflow-y:auto}
.scan.light .sbody{padding:12px;max-width:760px;width:100%;margin:0 auto}
.scan .shot{width:100%;max-height:34vh;object-fit:contain;border-radius:8px;background:#000;display:block;margin-bottom:10px}
.nums{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.num{background:#e8eef6;color:var(--blue);border:0;border-radius:99px;padding:7px 13px;font-size:15px;font-weight:600}
.scan pre{white-space:pre-wrap;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
/* Photo appendix: no frame, no background, image only */
.prow{display:flex;gap:3mm;margin:0 0 3mm}
.pfig{flex:1;min-width:0;margin:0;display:flex;flex-direction:column}
.pfig .cap{font-size:12px;color:var(--mut);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfig img{display:block;width:100%;height:auto;border:0;background:none}
.seg{display:flex;gap:8px;margin-top:8px}.seg .btn{flex:1;padding:10px}
@page{size:A4;margin:10mm}
@media print{
  header.top,.fab,.noprint,.overlay,.lightbox,.scan{display:none!important}
  body{background:#fff}main{max-width:none;padding:0}
  .card{border:0;padding:0}
  tr{page-break-inside:avoid}
  .prow{break-inside:avoid;margin:0}
  .pfig{padding:1.5mm}
  .pfig .cap{font-size:8pt;color:#333;height:4.5mm;margin:0}
  .pfig img{flex:1 1 0;min-height:0;width:100%;height:100%;object-fit:contain;object-position:center top}
  .pp4 .prow{height:136mm}
  .pp2 .prow{height:136mm}
  .pp1 .prow{height:272mm}
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<div id="dlg"></div>
<div id="lb"></div>
<div id="scan"></div>
<input type="file" id="imp" accept="application/json" hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="scanIn" accept="image/*" capture="environment" hidden>

<script>
/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const nowStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const todayStr=()=>nowStr().slice(0,10);
const urlCache=new WeakMap();
const urlOf=b=>{if(!urlCache.has(b))urlCache.set(b,URL.createObjectURL(b));return urlCache.get(b)};

/* ---------- Storage (IndexedDB) ---------- */
let dbP=null;
function db(){
  if(!dbP)dbP=new Promise((res,rej)=>{
    const r=indexedDB.open('matprotokoll',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('protocols',{keyPath:'id'});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return dbP;
}
async function tx(mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction('protocols',mode);const req=fn(t.objectStore('protocols'));
    t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}
const dbAll=()=>tx('readonly',s=>s.getAll());
const dbPut=p=>tx('readwrite',s=>s.put(p));
const dbDel=id=>tx('readwrite',s=>s.delete(id));

/* ---------- State ---------- */
let S={protocols:[],view:'list',id:null,draft:null,idx:null,restored:false,scan:null,scanFocus:'sc_laeq',perPage:localStorage.getItem('perPage')||'4'};
const cur=()=>S.protocols.find(p=>p.id===S.id);
let saveTimer=null;
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const p=cur();if(p)dbPut(p)},400)}

async function load(){
  S.protocols=(await dbAll()).sort((a,b)=>b.created-a.created);
  const dp=S.protocols.find(p=>p.draft);
  if(dp){
    S.id=dp.id;S.view='protocol';render(true);
    S.idx=dp.draft.idx;S.draft=dp.draft.data;S.restored=true;drawDlg();
    return;
  }
  render(true);
}

/* ---------- Views ---------- */
function setTop(title,left,right){
  $('#top').innerHTML=(left?`<button data-act="${left.act}">${left.txt}</button>`:'')+`<h1>${esc(title)}</h1>`+(right?`<button data-act="${right.act}">${right.txt}</button>`:'');
}
function render(scrollTop){
  const app=$('#app');
  if(S.view==='list'){setTop('Measurement Log',null,{act:'tools',txt:'Backup'});app.innerHTML=listView();}
  else if(S.view==='protocol'){const p=cur();setTop(p.project||'Log',{act:'home',txt:'‹ All'},{act:'report',txt:'Report'});app.innerHTML=protocolView(p);}
  else if(S.view==='report'){const p=cur();setTop('Report',{act:'back',txt:'‹ Back'},{act:'print',txt:'Print / PDF'});app.innerHTML=reportView(p);}
  if(scrollTop)window.scrollTo(0,0);
}

function listView(){
  const items=S.protocols.map(p=>{
    const n=p.meas.length,nr=p.meas.filter(m=>m.notMeasured).length,ph=p.meas.reduce((a,m)=>a+m.photos.length,0);
    return `<button class="item" data-act="open" data-id="${p.id}">
      <div class="t">${esc(p.project||'(unnamed)')}</div>
      <div class="s">${esc(p.date)} · ${esc(p.instrument||'no instrument')}</div>
      <div class="s"><span class="chip">${n} measurements</span>${nr?`<span class="chip red">${nr} not measured</span>`:''}<span class="chip">${ph} photos</span></div>
    </button>`}).join('');
  const ready=localStorage.getItem('ocrReady')==='1';
  return `${items||'<div class="empty">No logs yet.<br>Tap the button below to create one.</div>'}
    <div class="card"><h2>Camera scan</h2>
      <p class="muted">The reading engine is downloaded once (internet needed) and is then stored on the phone. ${ready?'<b>Downloaded on this phone.</b>':'Not downloaded yet.'}</p>
      <button class="btn sec block" id="prepBtn" data-act="prepScan">${ready?'Re-check scanner':'Download scanner for offline use'}</button></div>
    <button class="btn fab" data-act="newProt">+ New log</button>`;
}

function protocolView(p){
  const rows=p.meas.map((m,i)=>{
    const vals=m.notMeasured?'':[m.laeq!==''?`LAeq ${esc(m.laeq)}`:'',m.lamax!==''?`LAmax ${esc(m.lamax)}`:'',m.lceq!==''?`LCeq ${esc(m.lceq)}`:''].filter(Boolean).join(' · ');
    return `<button class="item" data-act="editMeas" data-i="${i}">
      <div class="t">${esc(m.room||'(room missing)')}${m.position?' – '+esc(m.position):''}</div>
      <div class="s">${esc(m.time)}${vals?' · '+vals+' dB':''}</div>
      <div class="s">${m.notMeasured?'<span class="chip red">Not measured</span>':'<span class="chip green">Measured</span>'}${m.bs?`<span class="chip">BS ${esc(m.bs)}</span>`:''}</div>
      ${m.photos.length?`<div class="thumbs">${m.photos.slice(0,5).map(f=>`<img src="${urlOf(f.blob)}" alt="">`).join('')}${m.photos.length>5?`<span class="muted">+${m.photos.length-5}</span>`:''}</div>`:''}
    </button>`}).join('');
  return `<div class="card"><h2>Project info</h2>
    <label>Project</label><input data-f="project" value="${esc(p.project)}" placeholder="e.g. Meydan One Mall">
    <div class="row"><div><label>Date</label><input data-f="date" type="date" value="${esc(p.date)}"></div>
    <div><label>Operator</label><input data-f="operator" value="${esc(p.operator)}"></div></div>
    <label>Instrument</label><input data-f="instrument" value="${esc(p.instrument)}" placeholder="e.g. Nor145-1">
    <label>General notes</label><textarea data-f="notes">${esc(p.notes)}</textarea>
    <label class="chk"><input type="checkbox" data-f="stamp" ${p.stamp!==false?'checked':''}> Stamp date/time on photos</label>
  </div>
  <h2 style="margin:16px 4px 8px;font-size:15px;color:var(--mut)">MEASUREMENTS (${p.meas.length})</h2>
  ${rows||'<div class="empty">No measurements yet.</div>'}
  <div class="card noprint"><button class="btn sec block" data-act="csv">Export CSV (Excel)</button>
  <button class="btn sec block" data-act="report">View report with photos</button>
  <button class="btn danger block" data-act="delProt">Delete log</button></div>
  <button class="btn fab" data-act="newMeas">+ New measurement</button>`;
}

function reportView(p){
  const pp=S.perPage,perRow=pp==='4'?2:1;
  const rows=p.meas.map((m,i)=>`<tr class="${m.notMeasured?'nr':''}">
    <td>${i+1}</td><td>${esc(m.room)}<br><span class="muted">${esc(m.position)}</span></td><td>${esc(m.time)}</td>
    <td>${m.notMeasured?'<b>Not measured</b>':`LAeq: ${esc(m.laeq)||'–'}<br>LAmax: ${esc(m.lamax)||'–'}<br>LCeq: ${esc(m.lceq)||'–'}`}</td>
    <td>${esc(m.bs)||'–'}<br><span class="muted">${esc(m.system)}</span></td>
    <td>${esc(m.comment)}</td>
    <td>${m.photos.length||'–'}</td></tr>`).join('');
  const figs=[];
  p.meas.forEach((m,i)=>m.photos.forEach((f,j)=>{
    figs.push(`<figure class="pfig"><div class="cap">${i+1}. ${esc(m.room||'(room missing)')}${m.position?' – '+esc(m.position):''}${m.photos.length>1?' ('+(j+1)+'/'+m.photos.length+')':''}</div><img src="${urlOf(f.blob)}" data-act="zoomR" data-i="${i}" data-j="${j}" alt=""></figure>`);
  }));
  let photos='';
  for(let k=0;k<figs.length;k+=perRow){
    const chunk=figs.slice(k,k+perRow);
    while(chunk.length<perRow)chunk.push('<figure class="pfig"></figure>');
    photos+=`<div class="prow">${chunk.join('')}</div>`;
  }
  const opt=(v,t)=>`<button class="btn ${pp===v?'':'sec'}" data-act="perPage" data-v="${v}">${t}</button>`;
  return `<div class="card"><h2 style="font-size:20px;color:var(--txt);text-transform:none">${esc(p.project)}</h2>
  <p class="muted">Date: ${esc(p.date)} · Operator: ${esc(p.operator)||'–'} · Instrument: ${esc(p.instrument)||'–'}</p>
  ${p.notes?`<p>${esc(p.notes)}</p>`:''}
  <div style="overflow-x:auto"><table class="rep"><thead><tr><th>#</th><th>Room / position</th><th>Time</th><th>Levels [dB]</th><th>Building services</th><th>Comment</th><th>Photos</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="card noprint"><h2>Photos per A4 page</h2>
    <div class="seg">${opt('4','4')}${opt('2','2')}${opt('1','1')}</div>
    <p class="muted">Each photo is shown as large as possible in its slot, without frame. 4 = two columns, two rows. 2 = two stacked. 1 = one photo per page. Tap a photo to zoom.</p></div>
  <div class="pp${pp}">${photos||'<div class="empty">No photos in this log.</div>'}</div>`;
}

/* ---------- Measurement dialog ---------- */
function newMeas(){return {id:uid(),room:'',position:'',time:nowStr(),laeq:'',lamax:'',lceq:'',bs:'',system:'',notMeasured:false,comment:'',photos:[]}}
function openMeas(i){
  const p=cur();S.restored=false;
  S.idx=i;
  S.draft=i==null?newMeas():{...p.meas[i],photos:[...p.meas[i].photos]};
  if(i==null&&p.meas.length){S.draft.room=p.meas[p.meas.length-1].room}
  drawDlg();
}
function drawDlg(){
  const d=S.draft;
  $('#dlg').innerHTML=`<div class="overlay"><div class="bar"><button data-act="closeDlg">Cancel</button><b>${S.idx==null?'New measurement':'Edit measurement'}</b><button data-act="saveMeas">Save</button></div>
  <main>
  ${S.restored?'<div class="card notice">Measurement in progress restored. Tap <b>Save</b> to keep it.</div>':''}
  <div class="card">
    <label>Room</label><input id="m_room" value="${esc(d.room)}" placeholder="e.g. Dining 3">
    <div class="row"><div><label>Position</label><input id="m_position" value="${esc(d.position)}" placeholder="P.1"></div>
    <div><label>Time</label><input id="m_time" value="${esc(d.time)}"></div></div>
    <label class="chk"><input type="checkbox" id="m_nm" ${d.notMeasured?'checked':''}> Not measured</label>
  </div>
  <div class="card"><div class="hdr"><h2>Levels [dB]</h2><button class="btn sm" data-act="scan">📷 Camera scan</button></div>
    <div class="row"><div><label>LAeq</label><input id="m_laeq" inputmode="decimal" value="${esc(d.laeq)}"></div>
    <div><label>LAmax</label><input id="m_lamax" inputmode="decimal" value="${esc(d.lamax)}"></div>
    <div><label>LCeq</label><input id="m_lceq" inputmode="decimal" value="${esc(d.lceq)}"></div></div>
  </div>
  <div class="card"><h2>Building services</h2>
    <div class="row"><div><label>Mode</label><select id="m_bs"><option value="">–</option><option ${d.bs==='ON'?'selected':''}>ON</option><option ${d.bs==='OFF'?'selected':''}>OFF</option></select></div>
    <div><label>System</label><input id="m_system" value="${esc(d.system)}" placeholder="AC, fan…"></div></div>
  </div>
  <div class="card"><label style="margin-top:0">Comment</label><textarea id="m_comment">${esc(d.comment)}</textarea></div>
  <div class="card"><h2>Photos</h2>
    <div class="row"><button class="btn" data-act="cam">📷 Take photo</button><button class="btn sec" data-act="gal">Choose image</button></div>
    <div id="photoGrid">${photoGrid()}</div>
  </div>
  ${S.idx!=null?'<button class="btn danger block" data-act="delMeas">Delete measurement</button>':''}
  </main></div>`;
}
function photoGrid(){
  const ph=S.draft.photos;
  return ph.length?`<div class="grid">${ph.map((f,i)=>`<div class="ph"><img src="${urlOf(f.blob)}" data-act="zoom" data-i="${i}" alt=""><button class="x" data-act="delPhoto" data-i="${i}">×</button></div>`).join('')}</div>`:'<p class="muted">No photos yet.</p>';
}
function readDraft(){
  const g=id=>$('#'+id).value;
  Object.assign(S.draft,{room:g('m_room').trim(),position:g('m_position').trim(),time:g('m_time'),laeq:g('m_laeq').trim(),lamax:g('m_lamax').trim(),lceq:g('m_lceq').trim(),bs:g('m_bs'),system:g('m_system').trim(),comment:g('m_comment').trim(),notMeasured:$('#m_nm').checked});
}

/* ---------- Draft autosave ---------- */
let draftTimer=null;
function saveDraft(){
  clearTimeout(draftTimer);
  const p=cur();if(!p||!S.draft||!$('#m_room'))return;
  readDraft();p.draft={idx:S.idx,data:S.draft};dbPut(p);
}
function saveDraftSoon(){clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,600)}
async function clearDraft(){
  clearTimeout(draftTimer);
  const p=cur();if(p&&p.draft){delete p.draft;await dbPut(p);}
}

/* ---------- Photos ---------- */
function loadImg(file){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u;});
}
async function processPhoto(file,d){
  const p=cur(),ts=nowStr();
  const im=await loadImg(file);
  const max=2400,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.round(im.naturalWidth*sc),h=Math.round(im.naturalHeight*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
  if(p.stamp!==false){
    if(S.draft===d&&$('#m_room'))readDraft();
    const label=[ts,d.room,d.position].filter(Boolean).join('  |  ');
    const fs=Math.max(14,Math.round(w/38));
    x.font=`bold ${fs}px Arial,sans-serif`;
    const tw=x.measureText(label).width,pd=fs*.4;
    x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,h-fs-pd*2,Math.min(w,tw+pd*2),fs+pd*2);
    x.fillStyle='#fff';x.textBaseline='middle';x.fillText(label,pd,h-fs/2-pd);
  }
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  return {id:uid(),blob,ts};
}
async function addPhotos(files){
  const d=S.draft,p=cur();
  for(const f of files){
    try{d.photos.push(await processPhoto(f,d));}catch(e){alert('Could not read the image.')}
  }
  if(S.draft===d&&$('#photoGrid')){$('#photoGrid').innerHTML=photoGrid();saveDraft();}
  else if(p)await dbPut(p);
}

/* ---------- Display parser (reads LAeq / LAmax / LCeq from OCR output) ---------- */
/* PARSER START */
const LABELS=[['lamax',/^L[A4][FSI]?M{1,2}[A4]?X/],['laeq',/^L[A4][FSI]?E[QO0]/],['lceq',/^L[CG][FSI]?E[QO0]/]];
function labelOf(t){
  const c=String(t).toUpperCase().replace(/[^A-Z0-9]/g,'');
  for(const [k,re] of LABELS)if(re.test(c))return k;
  return null;
}
function parseDisplay(words,text){
  const out={laeq:'',lamax:'',lceq:'',nums:[]};
  const items=(words||[]).filter(w=>w&&w.text&&String(w.text).trim()&&w.bbox).map((w,i)=>{
    const b=w.bbox;
    return {i,t:String(w.text).trim(),x0:b.x0,y0:b.y0,x1:b.x1,y1:b.y1,cx:(b.x0+b.x1)/2,cy:(b.y0+b.y1)/2,h:Math.max(1,b.y1-b.y0),w:Math.max(1,b.x1-b.x0)};
  });
  if(items.length){
    const labels=[],dec=[],ints=[];
    for(const it of items){
      const k=labelOf(it.t);
      if(k)labels.push({...it,k});
      const t=it.t.replace(/,/g,'.');
      for(const m of t.matchAll(/(?<![\d.])(\d{2,3}\.\d{1,2})(?!\d)/g)){
        const v=parseFloat(m[1]);if(v>=10&&v<=160)dec.push({...it,s:m[1]});
      }
      if(!k&&/^\d{2,3}$/.test(t)){const v=parseInt(t,10);if(v>=20&&v<=140)ints.push({...it,s:t,int:true});}
    }
    const pool=dec.concat(ints);
    const pairs=[];
    for(const L of labels)for(const N of pool){
      let sc=null;
      if(N.i===L.i)sc=-1;
      else{
        const rowTol=0.8*Math.max(L.h,N.h),dy=N.cy-L.cy,dx=N.x0-L.x1;
        if(Math.abs(dy)<=rowTol&&dx>=-L.w*0.3)sc=Math.max(0,dx)/L.h;
        else if(dy>0&&dy<L.h*6&&Math.abs(N.cx-L.cx)<=Math.max(L.w,N.w)*1.2)sc=40+dy/L.h;
      }
      if(sc!=null)pairs.push({L,N,sc:sc+(N.int?200:0)});
    }
    pairs.sort((a,b)=>a.sc-b.sc);
    const used=new Set();
    for(const p of pairs){
      if(out[p.L.k]||used.has(p.N))continue;
      out[p.L.k]=p.N.s;used.add(p.N);
    }
    const cand=(dec.length?dec:ints).slice().sort((a,b)=>(Math.round(a.cy/Math.max(a.h,1))-Math.round(b.cy/Math.max(b.h,1)))||(a.cx-b.cx));
    out.nums=[...new Set(cand.map(n=>n.s))].slice(0,12);
  }else if(text){
    // plain-text fallback: first decimal number after each label on the same line
    for(const line of String(text).split(/\r?\n/)){
      const l=line.replace(/,/g,'.');
      for(const m of l.matchAll(/(L[A-Z4][FSI]?[A-Z0-9]{2,3})\W*?(\d{2,3}\.\d{1,2})/gi)){
        const k=labelOf(m[1]);if(k&&!out[k])out[k]=m[2];
      }
      for(const m of l.matchAll(/(?<![\d.])(\d{2,3}\.\d{1,2})(?!\d)/g))out.nums.push(m[1]);
    }
    out.nums=[...new Set(out.nums)].slice(0,12);
  }
  return out;
}
/* PARSER END */

/* ---------- Camera scan ---------- */
const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
let tessWorker=null,tessLoading=null,ocrProg=null,camStream=null;
function loadScript(src){
  return new Promise((res,rej)=>{
    if(window.Tesseract)return res();
    const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load the scanner engine'));document.head.appendChild(s);
  });
}
function getOcr(){
  if(tessWorker)return Promise.resolve(tessWorker);
  if(!tessLoading)tessLoading=(async()=>{
    await loadScript(TESS_URL);
    const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(ocrProg)ocrProg(m)}});
    await w.setParameters({tessedit_pageseg_mode:'11'});
    tessWorker=w;localStorage.setItem('ocrReady','1');
    return w;
  })().catch(e=>{tessLoading=null;throw e});
  return tessLoading;
}
function prep(src,invert){
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
  const x=c.getContext('2d');x.drawImage(src,0,0);
  const id=x.getImageData(0,0,c.width,c.height),d=id.data,n=d.length/4,g=new Uint8Array(n),hist=new Uint32Array(256);
  for(let i=0;i<n;i++){const v=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])|0;g[i]=v;hist[v]++;}
  let acc=0,lo=0,hi=255;
  for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*0.02){lo=v;break;}}
  acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>=n*0.02){hi=v;break;}}
  const rng=Math.max(1,hi-lo);
  for(let i=0;i<n;i++){let v=Math.max(0,Math.min(255,(g[i]-lo)*255/rng));if(invert)v=255-v;d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;}
  x.putImageData(id,0,0);return c;
}
async function ocrCanvas(w,cv){
  const r=await w.recognize(cv),d=r.data;
  let words=d.words;
  if(!words&&d.blocks){words=[];d.blocks.forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>(l.words||[]).forEach(x=>words.push(x)))));}
  return {...parseDisplay(words,d.text),text:d.text||''};
}
const foundCount=r=>['laeq','lamax','lceq'].filter(k=>r[k]).length;
const setMsg=t=>{const el=$('#scMsg');if(el)el.textContent=t};

function openScan(){
  S.scan={stage:'cam'};drawScan();startCam();
  getOcr().catch(()=>{}); // warm up the engine while the user aims
}
async function startCam(){
  const v=$('#scV');if(!v)return;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=camStream;await v.play();
  }catch(e){
    const h=$('#scHint');if(h)h.textContent='Camera not available here. Tap "Use photo instead", or allow camera access.';
  }
}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}}
function closeScan(){stopCam();S.scan=null;ocrProg=null;$('#scan').innerHTML='';}
function canvasFrom(src,w,h){
  const sc=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c;
}
async function scanShot(){
  const v=$('#scV');if(!v||!v.videoWidth)return;
  const c=canvasFrom(v,v.videoWidth,v.videoHeight);stopCam();runScan(c);
}
async function scanFile(file){
  try{const im=await loadImg(file);stopCam();runScan(canvasFrom(im,im.naturalWidth,im.naturalHeight));}
  catch(e){const h=$('#scHint');if(h)h.textContent='Could not read that photo.';}
}
async function runScan(canvas){
  const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.85));
  S.scan={stage:'busy',blob};drawScan();
  let res={laeq:'',lamax:'',lceq:'',nums:[],text:''},error='';
  try{
    ocrProg=m=>{
      if(m.status==='recognizing text')setMsg('Reading display… '+Math.round((m.progress||0)*100)+'%');
      else if(m.status)setMsg('Preparing scanner… ('+m.status+')');
    };
    setMsg('Preparing scanner…');
    const w=await getOcr();
    setMsg('Reading display…');
    res=await ocrCanvas(w,prep(canvas,false));
    if(foundCount(res)<3){
      setMsg('Trying again with inverted colours…');
      const r2=await ocrCanvas(w,prep(canvas,true));
      if(foundCount(r2)>foundCount(res))res=r2;
    }
  }catch(e){
    error='The scanner engine could not be loaded or run. It must be downloaded once with internet. You can type the values yourself below.';
  }
  ocrProg=null;
  S.scan={stage:'review',blob,res,error};drawScan();
}
function drawScan(){
  const sc=S.scan,el=$('#scan');
  if(!sc){el.innerHTML='';return;}
  if(sc.stage==='cam'){
    el.innerHTML=`<div class="scan"><div class="sbar"><button data-act="scanClose">Cancel</button><b>Camera scan</b><span style="width:72px"></span></div>
    <video id="scV" playsinline muted autoplay></video>
    <div class="sfoot"><div class="hint" id="scHint">Hold the phone steady so the instrument display fills the screen, then tap Scan.</div>
    <div class="row"><button class="btn sec" data-act="scanPhoto">Use photo instead</button><button class="btn" data-act="scanShot">Scan</button></div></div></div>`;
  }else if(sc.stage==='busy'){
    el.innerHTML=`<div class="scan light"><div class="sbar"><b>Reading display…</b><span></span></div>
    <div class="sbody"><img class="shot" src="${urlOf(sc.blob)}" alt=""><p class="muted" id="scMsg">Starting…</p></div></div>`;
  }else{
    const r=sc.res,fld=(id,lab,k)=>`<div><label>${lab}</label><input id="${id}" inputmode="decimal" value="${esc(r[k])}" placeholder="not found"></div>`;
    const nums=r.nums.length?`<div class="nums">${r.nums.map(n=>`<button class="num" data-act="pickNum" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:'<p class="muted">No numbers detected.</p>';
    el.innerHTML=`<div class="scan light"><div class="sbar"><button data-act="scanClose">Cancel</button><b>Check values</b><span style="width:72px"></span></div>
    <div class="sbody"><img class="shot" src="${urlOf(sc.blob)}" alt="">
    ${sc.error?`<div class="card notice">${esc(sc.error)}</div>`:''}
    <div class="card"><h2>Detected values [dB]</h2>
      <div class="row">${fld('sc_laeq','LAeq (dBA)','laeq')}${fld('sc_lamax','LAmax','lamax')}${fld('sc_lceq','LCeq (dBC)','lceq')}</div>
      <p class="muted" style="margin-top:10px">Check against the display. You can edit any value, or tap a detected number below to put it in the field you last selected.</p>
      ${nums}
      <label class="chk"><input type="checkbox" id="sc_keep"> Also save this display photo in the measurement</label></div>
    <details class="card"><summary>What the scanner read</summary><pre>${esc(r.text||'(nothing)')}</pre></details>
    <div class="row"><button class="btn sec" data-act="scanAgain">Scan again</button><button class="btn" data-act="scanUse">Use values</button></div></div></div>`;
  }
}
async function applyScan(){
  const g=id=>($('#'+id).value||'').trim().replace(',','.');
  const vals={m_laeq:g('sc_laeq'),m_lamax:g('sc_lamax'),m_lceq:g('sc_lceq')};
  const keep=$('#sc_keep').checked,blob=S.scan.blob;
  for(const k in vals)if(vals[k])$('#'+k).value=vals[k];
  if(keep&&blob){try{S.draft.photos.push(await processPhoto(blob,S.draft));$('#photoGrid').innerHTML=photoGrid();}catch(e){}}
  closeScan();saveDraft();
}
async function prepScan(btn){
  btn.disabled=true;btn.textContent='Downloading… keep the app open';
  try{await getOcr();alert('Scanner is ready and stored on this phone.');}
  catch(e){alert('Could not download the scanner. Check your internet connection and try again.');}
  render();
}

/* ---------- Export / backup ---------- */
function download(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function exportCSV(p){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['Project','Date','Instrument','Operator','Room','Position','Time','LAeq [dB]','LAmax [dB]','LCeq [dB]','Building services','System','Not measured','Comment','Number of photos'];
  const lines=[head.map(q).join(';')];
  p.meas.forEach(m=>lines.push([p.project,p.date,p.instrument,p.operator,m.room,m.position,m.time,m.laeq,m.lamax,m.lceq,m.bs,m.system,m.notMeasured?'Yes':'',m.comment,m.photos.length].map(q).join(';')));
  download((p.project||'log').replace(/[^\w\-]+/g,'_')+'_'+p.date+'.csv',new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function backup(){
  const out=[];
  for(const pr of S.protocols){
    const {draft,...p}=pr;
    const meas=[];
    for(const m of p.meas){meas.push({...m,photos:await Promise.all(m.photos.map(async f=>({id:f.id,ts:f.ts,data:await b2d(f.blob)})))});}
    out.push({...p,meas});
  }
  download('measurement_log_backup_'+todayStr()+'.json',new Blob([JSON.stringify(out)],{type:'application/json'}));
}
async function restore(file){
  try{
    const data=JSON.parse(await file.text());
    for(const p of data){
      for(const m of p.meas){m.photos=await Promise.all(m.photos.map(async f=>({id:f.id,ts:f.ts,blob:await (await fetch(f.data)).blob()})));}
      await dbPut(p);
    }
    await load();alert('Backup restored.');
  }catch(e){alert('Could not read the backup file.')}
}

/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,p=cur();
  switch(a){
    case 'home':S.view='list';S.id=null;render(true);break;
    case 'back':S.view='protocol';render(true);break;
    case 'open':S.id=el.dataset.id;S.view='protocol';render(true);break;
    case 'newProt':{
      const n={id:uid(),created:Date.now(),project:'',date:todayStr(),operator:'',instrument:'',notes:'',stamp:true,meas:[]};
      S.protocols.unshift(n);await dbPut(n);S.id=n.id;S.view='protocol';render(true);break;}
    case 'delProt':
      if(confirm('Delete the entire log including photos?')){await dbDel(p.id);S.protocols=S.protocols.filter(x=>x.id!==p.id);S.view='list';S.id=null;render(true);}break;
    case 'newMeas':openMeas(null);break;
    case 'editMeas':openMeas(+el.dataset.i);break;
    case 'closeDlg':
      readDraft();
      if((S.draft.photos.length||S.draft.room||S.draft.laeq||S.draft.comment)&&!confirm('Discard this measurement without saving?'))break;
      await clearDraft();$('#dlg').innerHTML='';S.draft=null;break;
    case 'saveMeas':
      readDraft();
      if(S.idx==null)p.meas.push(S.draft);else p.meas[S.idx]=S.draft;
      clearTimeout(draftTimer);delete p.draft;
      await dbPut(p);$('#dlg').innerHTML='';S.draft=null;render();break;
    case 'delMeas':
      if(confirm('Delete this measurement?')){clearTimeout(draftTimer);delete p.draft;p.meas.splice(S.idx,1);await dbPut(p);$('#dlg').innerHTML='';S.draft=null;render();}break;
    case 'cam':$('#camIn').click();break;
    case 'gal':$('#galIn').click();break;
    case 'delPhoto':S.draft.photos.splice(+el.dataset.i,1);$('#photoGrid').innerHTML=photoGrid();saveDraft();break;
    case 'zoom':{const f=S.draft.photos[+el.dataset.i];$('#lb').innerHTML=`<div class="lightbox" data-act="closeLb"><img src="${urlOf(f.blob)}" alt=""></div>`;break;}
    case 'zoomR':{const f=p.meas[+el.dataset.i].photos[+el.dataset.j];$('#lb').innerHTML=`<div class="lightbox" data-act="closeLb"><img src="${urlOf(f.blob)}" alt=""></div>`;break;}
    case 'closeLb':$('#lb').innerHTML='';break;
    case 'report':S.view='report';render(true);break;
    case 'perPage':S.perPage=el.dataset.v;localStorage.setItem('perPage',S.perPage);render();break;
    case 'print':window.print();break;
    case 'csv':exportCSV(p);break;
    case 'scan':openScan();break;
    case 'scanClose':closeScan();break;
    case 'scanShot':scanShot();break;
    case 'scanPhoto':$('#scanIn').click();break;
    case 'scanAgain':S.scan={stage:'cam'};drawScan();startCam();break;
    case 'scanUse':applyScan();break;
    case 'pickNum':{const f=$('#'+(S.scanFocus||'sc_laeq'));if(f)f.value=el.dataset.v;break;}
    case 'prepScan':prepScan(el);break;
    case 'tools':
      if(confirm('OK = Save backup (JSON with all photos).\nCancel = Restore from a backup file.'))backup();else $('#imp').click();break;
  }
});
document.addEventListener('focusin',e=>{if(e.target.id&&e.target.id.startsWith('sc_')&&e.target.type!=='checkbox')S.scanFocus=e.target.id;});
document.addEventListener('input',e=>{
  if(e.target.id&&e.target.id.startsWith('m_')&&S.draft){saveDraftSoon();return;}
  const f=e.target.dataset&&e.target.dataset.f;if(!f||S.view!=='protocol')return;
  const p=cur();p[f]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(f==='project')$('#top h1').textContent=p.project||'Log';
  saveSoon();
});
$('#camIn').addEventListener('change',async e=>{await addPhotos([...e.target.files]);e.target.value=''});
$('#galIn').addEventListener('change',async e=>{await addPhotos([...e.target.files]);e.target.value=''});
$('#scanIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)scanFile(f);});
$('#imp').addEventListener('change',e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''});

/* ---------- Start ---------- */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
